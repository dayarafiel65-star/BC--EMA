<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tienda — Ñemones Basquet Club</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<nav class="topnav">
  <div class="wrap">
    <a href="index.html" class="brand">
      <svg class="crest" viewBox="0 0 40 40" style="color:var(--accent)">
        <circle cx="20" cy="20" r="18.5" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M6 6c8 8 8 20 0 28M34 6c-8 8-8 20 0 28M1 20h38" stroke="currentColor" stroke-width="1" fill="none" opacity="0.55"/>
        <text x="20" y="27" text-anchor="middle" font-family="'Bebas Neue',sans-serif" font-size="19" fill="currentColor">Ñ</text>
      </svg>
      ÑEMONES BC
    </a>
    <button class="navtoggle" aria-label="Abrir menú" aria-expanded="false">☰</button>
    <ul class="navlinks">
      <li><a href="index.html">Inicio</a></li>
      <li><a href="plantilla.html">Plantilla</a></li>
      <li><a href="tienda.html" aria-current="page">Tienda</a></li>
      <li><a href="reservas.html">Reservas</a></li>
    </ul>
  </div>
</nav>

<header class="hero" style="padding-bottom:0">
  <div class="wrap" style="grid-template-columns:1fr; padding-bottom:2.5rem">
    <div>
      <p class="kicker">Tienda oficial</p>
      <h1>EQUÍPATE<br>DE ÑEMÓN</h1>
      <p>Camisetas, sudaderas y complementos del club. Envíos ficticios de demostración, sin cobro real.</p>
    </div>
  </div>
</header>

<section style="padding-top:2.5rem">
  <div class="wrap">
    <div class="shopgrid" id="shopgrid"></div>
  </div>
</section>

<div class="cartbar">
  <button id="cartopen" class="btn solid">Cesta (<span id="cartcount">0</span>)</button>
</div>

<div class="cartpanel" id="cartpanel">
  <div class="cartbox">
    <h3>Tu cesta <button id="cartclose" aria-label="Cerrar cesta" class="btn ghost" style="padding:0.3em 0.7em">✕</button></h3>
    <div id="cartitems"></div>
    <div class="carttotal"><span>Total</span><span id="carttotal">0.00 €</span></div>
    <button id="checkout" class="btn solid">Finalizar pedido</button>
  </div>
</div>

<footer>
  <div class="wrap">
    <span>© <span data-year></span> Ñemones Basquet Club</span>
    <span>Pabellón Ñemón · Sitio no oficial de demostración</span>
  </div>
</footer>

<script src="js/data.js"></script>
<script src="js/ilustraciones.js"></script>
<script src="js/nav.js"></script>
<script src="js/tienda.js"></script>
</body>
</html>
